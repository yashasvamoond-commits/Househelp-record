<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E8620A" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="House help record: attendance, salary and advance (udhaar) register in Hindi and English." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/app.css" />
  <title>कामवाली रिकॉर्ड | House Help Record</title>
</head>
<body>
  <header class="appbar" id="appbar">
    <div class="appbar-left">
      <button class="icon-btn hidden" id="btnBack" aria-label="Back">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="appbar-title">
        <h1 id="screenTitle">कामवाली रिकॉर्ड</h1>
        <p id="screenSub"></p>
      </div>
    </div>
    <div class="lang-toggle" id="langToggle">
      <button type="button" class="lang-btn" data-lang="hi">हिंदी</button>
      <button type="button" class="lang-btn" data-lang="en">English</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <button class="fab hidden" id="fab" type="button">
    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span id="fabLabel"></span>
  </button>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="home">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 11l9-8 9 8M5 10v10h14V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="home">होम</span>
    </button>
    <button class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span data-i18n="attendance">हाज़िरी</span>
    </button>
    <button class="tab" data-tab="advance">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 3v18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 8h7a3 3 0 010 6H8a3 3 0 000 6h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="advance">उधार</span>
    </button>
    <button class="tab" data-tab="more">
      <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
      <span data-i18n="more">और</span>
    </button>
  </nav>

  <div class="sheet-backdrop hidden" id="sheetBackdrop">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <input type="file" id="importFile" accept="application/json,.json" class="hidden" />

  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
