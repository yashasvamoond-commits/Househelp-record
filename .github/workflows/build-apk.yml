name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 21 (Capacitor 7 requires JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Generate launcher icons
        run: |
          npx --yes @capacitor/assets generate --android --icon-background-color '#FBF7F2' \
            || (python3 -m pip install --quiet pillow && python3 scripts/make_icons.py)

      - name: Brand colours (saffron status bar)
        run: |
          python3 - <<'PY'
          import os, re
          path = 'android/app/src/main/res/values/colors.xml'
          want = {'colorPrimary': '#E8620A', 'colorPrimaryDark': '#C34E05', 'colorAccent': '#E8620A'}
          extra = ''
          if os.path.exists(path):
              m = re.search(r'<color name="ic_launcher_background">([^<]*)</color>', open(path).read())
              if m:
                  extra = '    <color name="ic_launcher_background">%s</color>\n' % m.group(1)
          body = ''.join('    <color name="%s">%s</color>\n' % (k, v) for k, v in want.items())
          with open(path, 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n' + body + extra + '</resources>\n')
          print(open(path).read())
          PY

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > househelp.jks
            echo "Using keystore from repository secret"
          else
            keytool -genkeypair -v -keystore househelp.jks -alias househelp \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass househelp -keypass househelp \
              -dname "CN=House Help Record, OU=Home, O=HouseHelp, L=Jaipur, ST=Rajasthan, C=IN"
            echo "No SIGNING_KEYSTORE_BASE64 secret - generated a one-off key for this build"
          fi

      - name: Show Android SDK contents
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK" || true
          ls "$SDK/build-tools" || true
          ls "$SDK/platforms" || true

      - name: Build release APK
        id: gradle
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Keep build log for debugging
        if: always()
        run: |
          mkdir -p .ci-logs
          cp gradle-build.log .ci-logs/gradle.log 2>/dev/null || true
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          { echo "ANDROID_HOME=$SDK"; ls "$SDK/build-tools"; ls "$SDK/platforms"; } > .ci-logs/sdk.txt 2>&1 || true

      - name: Push build log to the branch (debug only)
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .ci-logs
          git commit -m "ci: build log for run ${{ github.run_id }}" || exit 0
          git push origin HEAD:arena/a509db7d-househelp-record

      - name: Zipalign and sign
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "Signing $UNSIGNED with build-tools $BT"
          "$SDK/build-tools/$BT/zipalign" -f 4 "$UNSIGNED" app-aligned.apk
          "$SDK/build-tools/$BT/apksigner" sign \
            --ks househelp.jks --ks-key-alias househelp \
            --ks-pass pass:househelp --key-pass pass:househelp \
            --out HouseHelp-Record.apk app-aligned.apk
          "$SDK/build-tools/$BT/apksigner" verify HouseHelp-Record.apk
          ls -lh HouseHelp-Record.apk

      - name: Check the APK really contains the app
        run: |
          python3 - <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile('HouseHelp-Record.apk')
          names = z.namelist()
          checks = {
              'AndroidManifest.xml':        'AndroidManifest.xml' in names,
              'web app index.html':         'assets/public/index.html' in names,
              'web app js/app.js':          'assets/public/js/app.js' in names,
              'web app css':                'assets/public/css/app.css' in names,
              'launcher icons':             any(n.startswith('res/') and 'ic_launcher' in n for n in names),
              'dex bytecode':               any(n.endswith('.dex') for n in names),
          }
          for k, v in checks.items():
              print(('OK   ' if v else 'FAIL ') + k)
          sys.exit(0 if all(checks.values()) else 1)
          PY

      - name: Publish GitHub release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cp RELEASE_NOTES.md notes.md
          {
            echo ""
            echo "---"
            echo "**HouseHelp-Record.apk** · $(du -h HouseHelp-Record.apk | cut -f1) · SHA-256 \`$(sha256sum HouseHelp-Record.apk | cut -d' ' -f1)\`"
          } >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" HouseHelp-Record.apk --clobber
          else
            gh release create "$TAG" HouseHelp-Record.apk \
              --target "$GITHUB_SHA" \
              --title "कामवाली रिकॉर्ड · House Help Record $TAG" \
              --notes-file notes.md
          fi
