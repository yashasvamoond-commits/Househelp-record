name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Generate launcher icons
        run: |
          npx --yes @capacitor/assets generate --android --icon-background-color '#FBF7F2' \
            || (python3 -m pip install --quiet pillow && python3 scripts/make_icons.py)

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > househelp.jks
            echo "Using keystore from repository secret"
          else
            keytool -genkeypair -v -keystore househelp.jks -alias househelp \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass househelp -keypass househelp \
              -dname "CN=House Help Record, OU=Home, O=HouseHelp, L=Jaipur, ST=Rajasthan, C=IN"
            echo "No SIGNING_KEYSTORE_BASE64 secret - generated a one-off key for this build"
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Zipalign and sign
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "Signing $UNSIGNED with build-tools $BT"
          "$SDK/build-tools/$BT/zipalign" -f 4 "$UNSIGNED" app-aligned.apk
          "$SDK/build-tools/$BT/apksigner" sign \
            --ks househelp.jks --ks-key-alias househelp \
            --ks-pass pass:househelp --key-pass pass:househelp \
            --out HouseHelp-Record.apk app-aligned.apk
          "$SDK/build-tools/$BT/apksigner" verify HouseHelp-Record.apk
          ls -lh HouseHelp-Record.apk

      - name: Publish GitHub release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" HouseHelp-Record.apk --clobber
          else
            gh release create "$TAG" HouseHelp-Record.apk \
              --target "$GITHUB_SHA" \
              --title "House Help Record $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
